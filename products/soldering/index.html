<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soldering &amp; Rework | Lakshyam Enterprises</title>
  <meta name="description" content="Reflow ovens, wave soldering and BGA rework stations.">
  <meta name="theme-color" content="#0d1b2a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="products" data-cat="soldering">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-head pcb-bg">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="./">Home</a>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          <span aria-current="page">Products</span>
        </nav>
        <h1>Product catalogue</h1>
        <p>Production equipment, inspection systems, process tools and consumables for SMT and electronics assembly. Add items to your enquiry list and request one combined quotation.</p>
      </div>
    </section>

    <div class="wrap catalog">
      <aside class="sidebar" aria-label="Filter products">
        <form class="side-search" id="cat-search-form" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="cat-search">Search products</label>
          <input id="cat-search" type="search" placeholder="Search products or models" autocomplete="off">
        </form>
        <div class="chip-row" id="chip-row" role="tablist" aria-label="Categories"></div>
        <div class="side-groups" id="side-groups"></div>
      </aside>

      <div>
        <div class="toolbar">
          <div>
            <h2 id="tb-title">All products</h2>
            <p id="tb-sub"></p>
          </div>
          <div>
            <label class="sr-only" for="sort">Sort products</label>
            <select id="sort" class="select">
              <option value="default">Sort: Recommended</option>
              <option value="name">Name A–Z</option>
              <option value="model">Model number</option>
            </select>
          </div>
        </div>
        <div class="p-grid" id="grid"></div>
        <div id="parts-results" hidden></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
