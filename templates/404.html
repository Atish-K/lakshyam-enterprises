<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>/* 404 can be served at any depth: find the site root (GitHub Pages project sites live under /<repo>/) */(function(){var p=location.pathname.split("/");var b=location.hostname.endsWith(".github.io")&&p[1]?"/"+p[1]+"/":"/";document.write('<base href="'+b+'">');})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0d1b2a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="notfound"{{attrs}}>
  <div id="site-header"></div>

  <main id="main">
    <section class="section">
      <div class="wrap">
        <div class="empty">
          <span class="eyebrow">Error 404</span>
          <h3 style="font-size:28px;margin-top:14px">We couldn’t find that page</h3>
          <p>The page may have moved. Browse the catalogue, search for a part number, or contact us and we will help you find it.</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a class="btn btn-primary" href="products/">Browse products</a>
            <a class="btn btn-ghost" href="spare-parts/">Spare parts</a>
            <a class="btn btn-ghost" href="contact/">Contact us</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
